name: products_api

services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
